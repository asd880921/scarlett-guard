<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scarlett Guard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 側欄：結構性區域，用較重的材質與其他內容分層 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M4 20 L9 10 L14 24 L19 8 L24 18 L28 14" stroke="currentColor"
                  stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Scarlett Guard</span>
          <span class="brand-sub" id="brand-version"></span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item is-active" data-view="status">
          <span class="nav-glyph">⇄</span><span data-i18n="nav.status">狀態</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-glyph">⚙</span><span data-i18n="nav.settings">設定</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="pill" id="elevation-pill" data-tone="idle">
          <span class="dot"></span><span id="elevation-text" data-i18n="elev.checking"></span>
        </div>
      </div>
    </aside>

    <!-- 主要內容 -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">狀態</h1>
          <p id="view-sub"></p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-quiet" id="btn-refresh" data-i18n-title="top.refresh.tip">
            <span class="btn-glyph">↻</span><span data-i18n="top.refresh"></span>
          </button>
          <button class="btn btn-quiet" id="btn-minimise" data-i18n-title="top.minimise.tip">
            <span data-i18n="top.minimise"></span>
          </button>
        </div>
      </header>

      <div class="scroll-wrap">
        <div class="scroll-edge" aria-hidden="true"></div>
        <div class="scroll" id="scroll">
          <div class="scroll-inner">

            <!-- 未提權時的警示，僅在需要時出現 -->
            <div class="banner" id="elevation-banner" hidden>
              <div class="banner-body">
                <strong data-i18n="banner.elev.title"></strong>
                <span data-i18n="banner.elev.body"></span>
              </div>
              <button class="btn btn-primary btn-sm" id="btn-elevate"
                      data-i18n="banner.elev.action"></button>
            </div>

            <!-- ============ 狀態 ============ -->
            <section class="view is-active" data-view="status">

              <!-- 裝置沒有可用驅動時，這是唯一的出路，所以放在最上面 -->
              <div class="banner banner-warn" id="mode-broken-banner" hidden>
                <div class="banner-body">
                  <strong data-i18n="mode.broken.title"></strong>
                  <span id="mode-broken-detail"></span>
                </div>
                <button class="btn btn-primary btn-sm" id="btn-repair-mode"
                        data-i18n="mode.broken.action"></button>
              </div>

              <!-- 主角：模式切換器。選取指示器是共用的一片，會在兩段之間滑動 -->
              <div class="card modecard">
                <div class="modeswitch" id="modeswitch" role="radiogroup"
                     data-i18n-aria="mode.switch.aria">
                  <span class="modeswitch-indicator" id="modeswitch-indicator" aria-hidden="true"></span>

                  <button class="mode-option" data-mode="daily" role="radio" aria-checked="false">
                    <span class="mode-glyph" aria-hidden="true">🛡</span>
                    <span class="mode-name" data-i18n="mode.daily.name"></span>
                    <span class="mode-for" data-i18n="mode.daily.for"></span>
                  </button>

                  <button class="mode-option" data-mode="asio" role="radio" aria-checked="false">
                    <span class="mode-glyph" aria-hidden="true">🎛</span>
                    <span class="mode-name" data-i18n="mode.asio.name"></span>
                    <span class="mode-for" data-i18n="mode.asio.for"></span>
                  </button>
                </div>

                <p class="mode-status" id="mode-status" data-i18n="mode.detecting"></p>
              </div>

              <!-- 次要動作：視覺量體刻意低於模式切換器 -->
              <button class="action" id="btn-reset">
                <span class="action-label" data-i18n="reset.label"></span>
                <span class="action-sub" id="reset-hint"></span>
                <span class="action-spinner" aria-hidden="true"></span>
              </button>

              <div class="disclose" data-open="false" id="dis-tech">
                <button class="disclose-head" aria-expanded="false" aria-controls="tech-body">
                  <span class="disclose-chevron" aria-hidden="true">›</span>
                  <span data-i18n="tech.title"></span>
                  <span class="disclose-note" id="tech-note"></span>
                </button>
                <div class="disclose-body" id="tech-body">
                  <div class="disclose-inner">
                    <dl class="kv" id="mode-kv"></dl>
                    <div class="table-scroll">
                      <table class="table" id="devtable">
                        <thead><tr>
                          <th data-i18n="table.status"></th>
                          <th data-i18n="table.name"></th>
                          <th data-i18n="table.id"></th>
                        </tr></thead>
                        <tbody></tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>

              <div class="disclose" data-open="false" id="dis-log">
                <button class="disclose-head" aria-expanded="false" aria-controls="log-body">
                  <span class="disclose-chevron" aria-hidden="true">›</span>
                  <span data-i18n="log.title"></span>
                </button>
                <div class="disclose-body" id="log-body">
                  <div class="disclose-inner">
                    <ul class="timeline" id="timeline"></ul>
                    <div class="btn-row">
                      <button class="btn btn-quiet btn-sm" id="btn-clear-history"
                              data-i18n="btn.clear"></button>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- ============ 設定 ============ -->
            <section class="view" data-view="settings">
              <div class="card">
                <div class="card-head">
                  <h3 data-i18n="card.hotkey"></h3>
                  <div class="switch" id="sw-hotkey" role="switch" tabindex="0"
                       data-i18n-aria="card.hotkey"><span class="knob"></span></div>
                </div>
                <div class="row">
                  <div class="row-text">
                    <strong data-i18n="hotkey.combo"></strong>
                    <span data-i18n="hotkey.combo.sub"></span>
                  </div>
                  <div class="input-wrap">
                    <input type="text" id="cfg-hotkey" class="mono" spellcheck="false" />
                    <span class="input-note" id="hotkey-note"></span>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-head"><h3 data-i18n="card.behaviour"></h3></div>
                <div class="rowset">
                  <div class="row">
                    <div class="row-text">
                      <strong data-i18n="beh.autostart"></strong>
                      <span data-i18n="beh.autostart.sub"></span>
                    </div>
                    <div class="switch" id="sw-autostart" role="switch" tabindex="0"
                         data-i18n-aria="beh.autostart"><span class="knob"></span></div>
                  </div>
                  <div class="row">
                    <div class="row-text">
                      <strong data-i18n="beh.closetray"></strong>
                      <span data-i18n="beh.closetray.sub"></span>
                    </div>
                    <div class="switch" id="sw-closetray" role="switch" tabindex="0"
                         data-i18n-aria="beh.closetray"><span class="knob"></span></div>
                  </div>
                  <div class="row">
                    <div class="row-text">
                      <strong data-i18n="beh.notify"></strong>
                      <span data-i18n="beh.notify.sub"></span>
                    </div>
                    <div class="switch" id="sw-notify" role="switch" tabindex="0"
                         data-i18n-aria="beh.notify"><span class="knob"></span></div>
                  </div>
                  <div class="row">
                    <div class="row-text">
                      <strong data-i18n="lang.label"></strong>
                    </div>
                    <div class="input-wrap">
                      <select id="cfg-language"></select>
                    </div>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-head">
                  <h3 data-i18n="card.ghosts"></h3>
                  <span class="card-note" id="ghost-count">—</span>
                </div>
                <p class="hint" data-i18n="ghosts.hint"></p>
                <ul class="ghostlist" id="ghostlist"></ul>
                <div class="btn-row">
                  <button class="btn btn-quiet" id="btn-scan-ghosts" data-i18n="btn.scan"></button>
                  <button class="btn btn-danger" id="btn-remove-ghosts" disabled
                          data-i18n="btn.removesel"></button>
                </div>
              </div>

              <div class="card">
                <div class="card-head"><h3 data-i18n="card.data"></h3></div>
                <dl class="kv" id="paths-kv"></dl>
                <div class="btn-row">
                  <button class="btn btn-quiet" id="btn-open-data" data-i18n="btn.opendata"></button>
                  <button class="btn btn-quiet" id="btn-reset-settings"
                          data-i18n="btn.resetsettings"></button>
                </div>
              </div>
            </section>

          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>

  <div class="scrim" id="scrim" hidden>
    <div class="dialog card" id="dialog" role="dialog" aria-modal="true">
      <h3 id="dialog-title" data-i18n="dialog.title"></h3>
      <p id="dialog-body"></p>
      <div class="btn-row end">
        <button class="btn btn-quiet" id="dialog-cancel" data-i18n="dialog.cancel"></button>
        <button class="btn btn-danger" id="dialog-confirm" data-i18n="dialog.confirm"></button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
